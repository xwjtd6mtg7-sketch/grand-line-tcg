<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administration des cartes — Grand Line TCG</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;font-family:Figtree,ui-sans-serif,system-ui,sans-serif;
    color:#f3eee4;background:linear-gradient(#121820 0%,#0b1018 55%,#070b14 100%)}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}

  .wrap{max-width:1120px;margin:0 auto;padding:1.1rem 1rem 3rem}
  header{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.6rem;min-width:0}
  h1{font-family:Cinzel,serif;font-size:1.05rem;letter-spacing:.03em;color:#c9a227;margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.back{font-size:.78rem;color:#6b7380;text-decoration:none;white-space:nowrap}

  .btn{height:2.5rem;padding:0 1rem;border-radius:10px;border:0;background:#c9a227;
    color:#0a101c;font-weight:700;font-size:.85rem;white-space:nowrap}
  .btn.ghost{background:none;border:1px solid #f3eee438;color:#f3eee4;font-weight:600}

  .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
  .search{flex:1 1 220px;display:flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 .8rem;
    border:1px solid #f3eee438;border-radius:12px;background:#101828;color:#6b7380}
  .search input{flex:1;background:none;border:0;outline:none;color:#f3eee4;font-size:.9rem}
  select.filter{height:2.6rem;padding:0 .6rem;border-radius:12px;border:1px solid #f3eee438;
    background:#101828;color:#f3eee4;font-size:.85rem;flex:0 0 auto}

  .status{margin:0 0 .6rem;font-size:.82rem;color:#3d9a6a}
  .status.err{color:#f5a3a3}
  .count{margin:0 0 .8rem;font-size:.76rem;color:#6b7380}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
  .tile{position:relative;border:1px solid #f3eee41f;border-radius:14px;background:#172033;overflow:hidden;
    display:flex;flex-direction:column}
  .tile-img{position:relative;width:100%;aspect-ratio:63/88;background:#0b1018;overflow:hidden}
  .tile-img img{width:100%;height:100%;object-fit:cover;display:block}
  .tile-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#3a4457;font-size:2rem}
  .tile-actions{position:absolute;top:6px;right:6px;display:flex;gap:.3rem}
  .tile-actions button{width:1.9rem;height:1.9rem;border-radius:8px;border:1px solid #f3eee438;
    background:#05070ccc;color:#f3eee4;font-size:.85rem;backdrop-filter:blur(2px)}
  .tile-actions button.danger{color:#f5a3a3}
  .tile-body{padding:.5rem .55rem .6rem}
  .tile-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-meta{font-size:.66rem;color:#6b7380;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;
    padding:2rem;color:#9aa3b2}

  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:#05070ccc;padding:0}
  .form-card{width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;border-top:1px solid #f3eee438;
    border-radius:24px 24px 0 0;background:linear-gradient(#1a2130,#121820);padding:1rem 1.1rem 1.6rem;
    box-shadow:0 -18px 40px #0009}
  .form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
  .form-head h2{margin:0;font-family:Cinzel,serif;font-size:1rem}
  .form-head button{background:none;border:0;color:#6b7380;font-size:1.3rem;line-height:1}

  .form-body{display:grid;grid-template-columns:1fr;gap:1rem}
  .preview{display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .preview-img{width:150px;aspect-ratio:63/88;border-radius:10px;border:1px solid #f3eee438;
    background:#0b1018;overflow:hidden;position:relative}
  .preview-img img{width:100%;height:100%;object-fit:cover;display:block}
  .preview-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#3a4457;text-align:center;padding:.5rem;font-size:.72rem}

  fieldset{border:1px solid #f3eee424;border-radius:12px;padding:.8rem .8rem .3rem;margin:0}
  legend{padding:0 .4rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#c9a227}

  .field{display:flex;flex-direction:column;gap:.35rem;font-size:.78rem;color:#9aa3b2;margin-bottom:.7rem}
  .field input,.field select,.field textarea{height:2.6rem;padding:0 .8rem;border-radius:10px;
    border:1px solid #f3eee438;background:#101828;color:#f3eee4;font-size:.9rem;outline:none;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#c9a227}
  .field textarea{height:auto;padding:.6rem .8rem;resize:vertical}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .field-grid.g4{grid-template-columns:repeat(4,1fr)}

  .chips{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{padding:.35rem .7rem;border-radius:999px;border:1px solid #f3eee438;background:#101828;
    color:#6b7380;font-size:.76rem}
  .chip.on{border-color:#c9a227;color:#c9a227;background:#c9a22729}

  .form-foot{display:flex;gap:.6rem;margin-top:1.1rem;position:sticky;bottom:-1.6rem;background:inherit;
    padding-top:.4rem}
  .form-foot button{flex:1;height:2.8rem;border-radius:10px;font-weight:700;font-size:.88rem}
  .form-foot .cancel{border:1px solid #f3eee438;background:none;color:#f3eee4}
  .form-foot .save{border:0;background:#c9a227;color:#0a101c}
  .form-foot .save:disabled{opacity:.5;cursor:wait}

  label.check{display:flex;align-items:center;gap:.5rem;font-size:.84rem;color:#9aa3b2;margin-bottom:.3rem}

  /* Desktop: centered modal instead of a bottom sheet, two-column form body */
  @media (min-width:760px){
    .overlay{align-items:center}
    .form-card{max-width:760px;border-radius:22px;max-height:88dvh}
    .form-body{grid-template-columns:170px 1fr;align-items:start}
    .form-foot{position:static}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  }
</style>
</head>
<body>
  <div id="app" class="gate">Chargement…</div>

  <script>
    const COLORS = ["Red", "Green", "Blue", "Purple", "Black", "Yellow"];
    const TYPES = ["Leader", "Character", "Event", "Stage", "DON!!"];
    const app = document.getElementById("app");

    function blankCard() {
      return {
        id: "", name: "", set: "", setName: "", rarity: "C", colors: [], type: "Character",
        life: null, cost: null, power: null, counter: null, traits: [], attr: null,
        text: "", textEn: "", image: "", parallel: false, src: "custom",
      };
    }

    async function boot() {
      let status;
      try {
        const r = await fetch("/api/admin/status", { credentials: "include" });
        status = await r.json();
      } catch {
        app.textContent = "Impossible de contacter le serveur.";
        return;
      }
      if (!status.signedIn) {
        app.innerHTML = '<div class="gate">Connecte-toi pour accéder à l\'administration.<br><br><a class="back" href="/login.html">Se connecter →</a></div>';
        return;
      }
      if (!status.isAdmin) {
        app.innerHTML = '<div class="gate">Accès réservé à l\'administrateur du jeu.</div>';
        return;
      }
      renderEditor();
    }

    async function fetchCards() {
      const [baseRes, overridesRes] = await Promise.all([
        fetch("/data/catalog.json?admin=1"),
        fetch("/api/card-overrides", { credentials: "include" }),
      ]);
      const base = await baseRes.json();
      const overrides = overridesRes.ok ? await overridesRes.json() : [];
      const byId = new Map(base.cards.map((c) => [c.id, c]));
      for (const o of overrides) {
        if (o.action === "delete") byId.delete(o.id);
        else if (o.card) byId.set(o.id, o.card);
      }
      return Array.from(byId.values());
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderEditor() {
      app.className = "";
      app.innerHTML = `
        <div class="wrap">
          <header>
            <div class="brand"><h1>Administration des cartes</h1></div>
            <div style="display:flex;gap:.5rem;align-items:center">
              <a class="back" href="/">← Jeu</a>
              <button class="btn" id="new-card">+ Nouvelle carte</button>
            </div>
          </header>
          <div class="toolbar">
            <div class="search"><span>🔍</span><input id="q" placeholder="Rechercher par nom, id ou set…" /></div>
            <select class="filter" id="f-type-filter"><option value="">Tous les types</option>${TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
            <select class="filter" id="f-color-filter"><option value="">Toutes les couleurs</option>${COLORS.map((c) => `<option value="${c}">${c}</option>`).join("")}</select>
          </div>
          <p class="status" id="status" hidden></p>
          <p class="count" id="count"></p>
          <div class="grid" id="list"></div>
        </div>
      `;
      let cards = [];
      let q = "";
      let typeFilter = "";
      let colorFilter = "";

      const list = document.getElementById("list");
      const countEl = document.getElementById("count");
      const statusEl = document.getElementById("status");

      function showStatus(msg, isErr) {
        statusEl.hidden = false;
        statusEl.className = "status" + (isErr ? " err" : "");
        statusEl.textContent = msg;
      }

      function renderList() {
        const query = q.trim().toLowerCase();
        let filtered = cards;
        if (query) {
          filtered = filtered.filter(
            (c) => c.id.toLowerCase().includes(query) || c.name.toLowerCase().includes(query) || c.set.toLowerCase().includes(query),
          );
        }
        if (typeFilter) filtered = filtered.filter((c) => c.type === typeFilter);
        if (colorFilter) filtered = filtered.filter((c) => c.colors?.includes(colorFilter));

        const shown = filtered.slice(0, 240);
        countEl.textContent =
          cards.length + " carte(s) au total" +
          (shown.length < filtered.length ? ` — ${shown.length} affichées, affine ta recherche` : "");
        list.innerHTML = "";
        for (const card of shown) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.innerHTML = `
            <div class="tile-img">
              <div class="ph">🂠</div>
              ${card.image ? `<img src="${esc(card.image)}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
              <div class="tile-actions">
                <button aria-label="Modifier" data-act="edit">✎</button>
                <button aria-label="Supprimer" class="danger" data-act="del">🗑</button>
              </div>
            </div>
            <div class="tile-body">
              <div class="tile-name">${esc(card.name)}</div>
              <div class="tile-meta">${esc(card.id)} · ${esc(card.set)} · ${esc(card.rarity)}</div>
            </div>
          `;
          tile.querySelector('[data-act="edit"]').onclick = () => openForm(card, false);
          tile.querySelector('[data-act="del"]').onclick = () => removeCard(card);
          list.appendChild(tile);
        }
      }

      async function refresh() {
        cards = await fetchCards();
        renderList();
      }

      async function removeCard(card) {
        if (!window.confirm(`Supprimer « ${card.name} » (${card.id}) du jeu ?`)) return;
        try {
          const r = await fetch("/api/admin/cards?id=" + encodeURIComponent(card.id), {
            method: "DELETE",
            credentials: "include",
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Échec de la suppression.");
          showStatus(`« ${card.name} » supprimée.`);
          await refresh();
        } catch (ex) {
          showStatus(ex.message, true);
        }
      }

      async function saveCard(input, saveBtn) {
        saveBtn.disabled = true;
        try {
          const r = await fetch("/api/admin/cards", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(input),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Échec de l'enregistrement.");
          showStatus(`« ${input.name} » enregistrée.`);
          document.getElementById("overlay")?.remove();
          q = input.id;
          document.getElementById("q").value = q;
          await refresh();
        } catch (ex) {
          showStatus(ex.message, true);
        } finally {
          saveBtn.disabled = false;
        }
      }

      function openForm(card, isNew) {
        const form = isNew ? blankCard() : { ...card, textEn: card.textEn ?? "" };
        const overlay = document.createElement("div");
        overlay.className = "overlay";
        overlay.id = "overlay";
        overlay.innerHTML = `
          <div class="form-card">
            <div class="form-head">
              <h2>${isNew ? "Nouvelle carte" : "Modifier " + esc(card.id)}</h2>
              <button type="button" id="close-form" aria-label="Fermer">×</button>
            </div>
            <div class="form-body">
              <div class="preview">
                <div class="preview-img" id="preview-img"><div class="ph">Aucune image</div></div>
                <div class="field" style="width:100%;margin:0">
                  <span>Image (chemin ou URL)</span>
                  <input id="f-image" placeholder="/cards-fr/OP01-999.webp ou https://…" />
                </div>
                <label class="check" style="width:100%"><input type="checkbox" id="f-parallel" /> Carte parallèle / alternative</label>
              </div>
              <div>
                <fieldset style="margin-bottom:.9rem">
                  <legend>Identité</legend>
                  <div class="field"><span>Identifiant</span><input id="f-id" placeholder="OP01-999" ${isNew ? "" : "disabled"} /></div>
                  <div class="field"><span>Nom</span><input id="f-name" /></div>
                  <div class="field-grid">
                    <div class="field"><span>Set</span><input id="f-set" /></div>
                    <div class="field"><span>Nom du set</span><input id="f-setName" /></div>
                  </div>
                </fieldset>
                <fieldset style="margin-bottom:.9rem">
                  <legend>Statistiques</legend>
                  <div class="field-grid">
                    <div class="field"><span>Rareté</span><input id="f-rarity" /></div>
                    <div class="field"><span>Type</span>
                      <select id="f-type">${TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
                    </div>
                  </div>
                  <div class="field"><span>Couleurs</span><div class="chips" id="f-colors">
                    ${COLORS.map((c) => `<button type="button" class="chip" data-c="${c}">${c}</button>`).join("")}
                  </div></div>
                  <div class="field-grid g4">
                    <div class="field"><span>Vie</span><input id="f-life" inputmode="numeric" /></div>
                    <div class="field"><span>Coût</span><input id="f-cost" inputmode="numeric" /></div>
                    <div class="field"><span>Puissance</span><input id="f-power" inputmode="numeric" /></div>
                    <div class="field"><span>Contre</span><input id="f-counter" inputmode="numeric" /></div>
                  </div>
                  <div class="field-grid">
                    <div class="field"><span>Traits (virgules)</span><input id="f-traits" /></div>
                    <div class="field"><span>Attribut</span><input id="f-attr" /></div>
                  </div>
                </fieldset>
                <fieldset style="margin-bottom:.9rem">
                  <legend>Texte</legend>
                  <div class="field"><span>Texte (français)</span><textarea id="f-text" rows="3"></textarea></div>
                  <div class="field"><span>Texte (anglais, optionnel)</span><textarea id="f-textEn" rows="2"></textarea></div>
                </fieldset>
                <fieldset>
                  <legend>Origine</legend>
                  <div class="field" style="margin-bottom:0"><span>Source</span><input id="f-src" placeholder="custom" /></div>
                </fieldset>
              </div>
            </div>
            <div class="form-foot">
              <button type="button" class="cancel" id="cancel-form">Annuler</button>
              <button type="button" class="save" id="save-form">Enregistrer</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        const $ = (id) => overlay.querySelector(id);
        $("#f-id").value = form.id;
        $("#f-name").value = form.name;
        $("#f-set").value = form.set;
        $("#f-setName").value = form.setName;
        $("#f-rarity").value = form.rarity;
        $("#f-type").value = form.type;
        $("#f-life").value = form.life ?? "";
        $("#f-cost").value = form.cost ?? "";
        $("#f-power").value = form.power ?? "";
        $("#f-counter").value = form.counter ?? "";
        $("#f-traits").value = form.traits.join(", ");
        $("#f-attr").value = form.attr ?? "";
        $("#f-text").value = form.text;
        $("#f-textEn").value = form.textEn || "";
        $("#f-image").value = form.image;
        $("#f-parallel").checked = form.parallel;
        $("#f-src").value = form.src || "custom";

        const colors = new Set(form.colors);
        overlay.querySelectorAll(".chip").forEach((chip) => {
          if (colors.has(chip.dataset.c)) chip.classList.add("on");
          chip.onclick = () => {
            if (colors.has(chip.dataset.c)) colors.delete(chip.dataset.c);
            else colors.add(chip.dataset.c);
            chip.classList.toggle("on");
          };
        });

        const previewBox = $("#preview-img");
        function updatePreview() {
          const url = $("#f-image").value.trim();
          previewBox.innerHTML = "";
          if (!url) {
            previewBox.innerHTML = '<div class="ph">Aucune image</div>';
            return;
          }
          const img = document.createElement("img");
          img.src = url;
          img.alt = "";
          img.onerror = () => {
            previewBox.innerHTML = '<div class="ph">Image introuvable</div>';
          };
          previewBox.appendChild(img);
        }
        $("#f-image").addEventListener("input", updatePreview);
        updatePreview();

        const num = (v) => {
          const t = v.trim();
          if (!t) return null;
          const n = Number(t);
          return Number.isFinite(n) ? Math.trunc(n) : null;
        };

        overlay.querySelector("#close-form").onclick = () => overlay.remove();
        overlay.querySelector("#cancel-form").onclick = () => overlay.remove();
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
        const saveBtn = overlay.querySelector("#save-form");
        saveBtn.onclick = () => {
          saveCard(
            {
              id: $("#f-id").value.trim(),
              name: $("#f-name").value.trim(),
              set: $("#f-set").value.trim(),
              setName: $("#f-setName").value.trim(),
              rarity: $("#f-rarity").value.trim(),
              colors: Array.from(colors),
              type: $("#f-type").value,
              life: num($("#f-life").value),
              cost: num($("#f-cost").value),
              power: num($("#f-power").value),
              counter: num($("#f-counter").value),
              traits: $("#f-traits").value.split(",").map((s) => s.trim()).filter(Boolean),
              attr: $("#f-attr").value.trim() || null,
              text: $("#f-text").value,
              textEn: $("#f-textEn").value.trim() || undefined,
              image: $("#f-image").value.trim(),
              parallel: $("#f-parallel").checked,
              src: $("#f-src").value.trim() || "custom",
            },
            saveBtn,
          );
        };
      }

      document.getElementById("new-card").onclick = () => openForm(blankCard(), true);
      document.getElementById("q").addEventListener("input", (e) => {
        q = e.target.value;
        renderList();
      });
      document.getElementById("f-type-filter").addEventListener("change", (e) => {
        typeFilter = e.target.value;
        renderList();
      });
      document.getElementById("f-color-filter").addEventListener("change", (e) => {
        colorFilter = e.target.value;
        renderList();
      });

      refresh();
    }

    boot();
  </script>
</body>
</html>
