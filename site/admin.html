<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Administrateur — Grand Line TCG</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;font-family:Figtree,ui-sans-serif,system-ui,sans-serif;
    color:#f3eee4;background:linear-gradient(#121820 0%,#0b1018 55%,#070b14 100%)}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}

  .wrap{width:min(100%, 1120px);margin:0 auto;padding:
    max(1.1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
    max(3rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left))}
  .btn{height:2.5rem;min-height:44px;padding:0 1rem;border-radius:10px;border:0;background:#c9a227;
    color:#0a101c;font-weight:700;font-size:.85rem;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 150px),1fr));gap:.8rem}
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:#05070ccc;padding:0;padding-bottom:env(safe-area-inset-bottom)}
  .form-card{width:min(100%, 560px);max-height:94dvh;overflow-y:auto;border-top:1px solid #f3eee438;
    border-radius:24px 24px 0 0;background:linear-gradient(#1a2130,#121820);padding:1rem 1.1rem 1.6rem;
    box-shadow:0 -18px 40px #0009}
  header{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.6rem;min-width:0}
  h1{font-family:Cinzel,serif;font-size:1.05rem;letter-spacing:.03em;color:#c9a227;margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.back{font-size:.78rem;color:#6b7380;text-decoration:none;white-space:nowrap}

  .btn.ghost{background:none;border:1px solid #f3eee438;color:#f3eee4;font-weight:600}

  .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
  .search{flex:1 1 220px;display:flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 .8rem;
    border:1px solid #f3eee438;border-radius:12px;background:#101828;color:#6b7380}
  .search input{flex:1;background:none;border:0;outline:none;color:#f3eee4;font-size:.9rem}
  select.filter{height:2.6rem;padding:0 .6rem;border-radius:12px;border:1px solid #f3eee438;
    background:#101828;color:#f3eee4;font-size:.85rem;flex:0 0 auto}

  .status{margin:0 0 .6rem;font-size:.82rem;color:#3d9a6a}
  .status.err{color:#f5a3a3}
  .count{margin:0 0 .8rem;font-size:.76rem;color:#6b7380}

  .tile{position:relative;border:1px solid #f3eee41f;border-radius:14px;background:#172033;overflow:hidden;
    display:flex;flex-direction:column}
  .tile-img{position:relative;width:100%;aspect-ratio:63/88;background:#0b1018;overflow:hidden}
  .tile-img img{width:100%;height:100%;object-fit:cover;display:block}
  .tile-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#3a4457;font-size:2rem}
  .tile-actions{position:absolute;top:6px;right:6px;display:flex;gap:.3rem}
  .tile-actions button{width:1.9rem;height:1.9rem;border-radius:8px;border:1px solid #f3eee438;
    background:#05070ccc;color:#f3eee4;font-size:.85rem;backdrop-filter:blur(2px)}
  .tile-actions button.danger{color:#f5a3a3}
  .tile-body{padding:.5rem .55rem .6rem}
  .tile-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-meta{font-size:.66rem;color:#6b7380;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;
    padding:2rem;color:#9aa3b2}

  .form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
  .form-head h2{margin:0;font-family:Cinzel,serif;font-size:1rem}
  .form-head button{background:none;border:0;color:#6b7380;font-size:1.3rem;line-height:1}

  .form-body{display:grid;grid-template-columns:1fr;gap:1rem}
  .preview{display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .preview-img{width:150px;aspect-ratio:63/88;border-radius:10px;border:1px solid #f3eee438;
    background:#0b1018;overflow:hidden;position:relative}
  .preview-img img{width:100%;height:100%;object-fit:cover;display:block}
  .preview-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#3a4457;text-align:center;padding:.5rem;font-size:.72rem}

  fieldset{border:1px solid #f3eee424;border-radius:12px;padding:.8rem .8rem .3rem;margin:0}
  legend{padding:0 .4rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#c9a227}

  .field{display:flex;flex-direction:column;gap:.35rem;font-size:.78rem;color:#9aa3b2;margin-bottom:.7rem}
  .field input,.field select,.field textarea{height:2.6rem;padding:0 .8rem;border-radius:10px;
    border:1px solid #f3eee438;background:#101828;color:#f3eee4;font-size:.9rem;outline:none;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#c9a227}
  .field textarea{height:auto;padding:.6rem .8rem;resize:vertical}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .field-grid.g4{grid-template-columns:repeat(4,1fr)}

  .chips{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{padding:.35rem .7rem;border-radius:999px;border:1px solid #f3eee438;background:#101828;
    color:#6b7380;font-size:.76rem}
  .chip.on{border-color:#c9a227;color:#c9a227;background:#c9a22729}

  .form-foot{display:flex;gap:.6rem;margin-top:1.1rem;position:sticky;bottom:-1.6rem;background:inherit;
    padding-top:.4rem}
  .form-foot button{flex:1;height:2.8rem;border-radius:10px;font-weight:700;font-size:.88rem}
  .form-foot .cancel{border:1px solid #f3eee438;background:none;color:#f3eee4}
  .form-foot .save{border:0;background:#c9a227;color:#0a101c}
  .form-foot .save:disabled{opacity:.5;cursor:wait}

  label.check{display:flex;align-items:center;gap:.5rem;font-size:.84rem;color:#9aa3b2;margin-bottom:.3rem}

  .tabs{display:flex;gap:6px;margin:0 0 1rem;border-bottom:1px solid #c9a22733}
  .tab{flex:0 0 auto;min-height:40px;padding:.55rem 1rem;background:none;border:0;border-bottom:2px solid transparent;
    color:#8b93a0;font:700 13px inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .tab.on{color:#e8d48a;border-bottom-color:#c9a227}
  .u-list{display:grid;gap:.7rem}
  .u-card{border:1px solid #c9a22733;border-radius:14px;background:#0e141c;padding:.85rem 1rem}
  .u-card.is-ban{opacity:.7;border-color:#c81e1e66}
  .u-top{display:flex;align-items:center;gap:.6rem}
  .u-ban{background:#c81e1e;color:#fff;font-size:.65rem;font-style:normal;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 8px}
  .u-role{font-size:.65rem;font-style:normal;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;border-radius:99px;padding:2px 8px;border:1px solid #c9a22766;
    color:#e8d48a;background:#c9a22722}
  .u-role.is-user{border-color:#6b738066;color:#9aa3b2;background:#ffffff0a}
  .u-role.is-moderator{border-color:#4d8fd688;color:#8ec4f0;background:#4d8fd622}
  .u-role.is-admin{border-color:#c9a227aa;color:#102030;background:linear-gradient(#f0d78a,#c9a227)}
  .u-role.is-owner{border-color:#e8d48a;color:#e8d48a;background:#c9a22733;
    box-shadow:0 0 10px #c9a22744}
  .u-role-help{margin:.2rem 0 0;font-size:.78rem;color:#8b93a0;line-height:1.4}
  .u-mail,.u-code{margin:.25rem 0 0;font-size:.78rem;color:#c9b58a}
  .u-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
  .u-actions button{height:2.1rem;padding:0 .7rem;border-radius:999px;border:1px solid #c9a22744;
    background:#141b26;color:#f4ead4;font-size:.72rem;font-weight:700}
  .u-actions button.danger{border-color:#c81e1e66;color:#f5a3a3}

  @media (min-width:760px){
    .overlay{align-items:center;padding:1.5rem}
    .form-card{max-width:760px;width:min(92vw,760px);border-radius:22px;max-height:88dvh;border:1px solid #f3eee438}
    .form-body{grid-template-columns:170px 1fr;align-items:start}
    .form-foot{position:static}
  }
  @media (min-width:1120px){
    .wrap{max-width:1200px;padding:1.6rem 1.6rem 3rem}
    .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
    .overlay{align-items:center;padding:2rem}
    .form-card{max-width:800px;width:min(92vw,800px);border-radius:22px}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    .field-grid,.field-grid.g4{grid-template-columns:1fr 1fr}
  }
  @media (orientation:landscape) and (max-height:500px){
    .overlay{align-items:center}
    .form-card{max-height:96dvh;border-radius:16px;width:min(96vw,720px)}
    header{margin-bottom:.5rem}
  }

  /* Confirm popup */
  .overlay.is-confirm{z-index:40;align-items:center;justify-content:center;padding:1.2rem}
  .confirm-card{
    width:min(100%, 380px);border:1px solid #c9a22766;border-radius:20px;
    background:linear-gradient(#1a2130,#0e141c);padding:1.2rem 1.15rem 1.15rem;
    box-shadow:0 18px 40px #000a,0 0 24px #c9a22722,inset 0 1px #f4ead422
  }
  .confirm-card h2{margin:0 0 .55rem;font-family:Cinzel,serif;font-size:1.02rem;color:#e8d48a;letter-spacing:.04em}
  .confirm-card p{margin:0 0 1.1rem;font-size:.9rem;line-height:1.45;color:#c9b58a}
  .confirm-card .form-foot{position:static;margin:0;padding:0;background:none}
  .form-foot .save.is-danger{background:#c81e1e;color:#fff}

  /* Mobile-first admin */
  @media (max-width:759px){
    html,body{overflow-x:hidden;max-width:100%}
    .wrap{padding:max(10px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom))}
    .admin-chrome{
      position:sticky;top:0;z-index:6;background:linear-gradient(#121820 70%,#0b1018ee);
      padding-bottom:0;border-bottom:1px solid #c9a22722
    }
    .admin-chrome header{margin-bottom:.45rem;align-items:center}
    h1{font-size:.98rem;letter-spacing:.06em}
    a.back{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:36px;padding:0 12px;border-radius:999px;
      background:linear-gradient(#f0d78a,#c9a227);color:#102030;font:700 12px Figtree,sans-serif;
      text-decoration:none
    }
    .tabs{gap:0;margin:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:1 0 auto;min-height:44px;padding:.6rem .9rem;font-size:12px}
    .toolbar{flex-direction:column;align-items:stretch;gap:.45rem}
    .search{flex:none;width:100%;height:46px}
    .search input,.field input,.field select,.field textarea{font-size:16px}
    select.filter{width:100%;height:46px}
    .btn{width:100%;height:46px;min-height:46px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
    .tile-actions{top:4px;right:4px;gap:.25rem}
    .tile-actions button{width:36px;height:36px;min-width:36px;font-size:.95rem}
    .tile-name{font-size:.74rem}
    .tile-meta{font-size:.62rem}
    .u-card{padding:.85rem .8rem}
    .u-top{flex-wrap:wrap;gap:.4rem}
    .u-actions{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
    .u-actions button{height:44px;min-height:44px;width:100%;padding:0 .4rem;font-size:.78rem}
    .field-grid,.field-grid.g4{grid-template-columns:1fr 1fr}
    .overlay{align-items:flex-end}
    .form-card{
      width:100%;max-height:92dvh;border-radius:20px 20px 0 0;
      padding:14px 14px calc(14px + env(safe-area-inset-bottom))
    }
    .form-body{grid-template-columns:1fr;gap:.75rem}
    .preview-img{width:110px}
    .form-foot{position:sticky;bottom:-14px;gap:.5rem;padding:.55rem 0 .1rem}
    .form-foot button{min-height:48px;height:48px}
    .gate{padding:1.4rem}
  }
</style>
</head>
<body>
  <div id="app" class="gate">Chargement…</div>

  <script>
    const COLORS = ["Red", "Green", "Blue", "Purple", "Black", "Yellow"];
    const TYPES = ["Leader", "Character", "Event", "Stage", "DON!!"];
    const app = document.getElementById("app");

    function blankCard() {
      return {
        id: "", name: "", set: "", setName: "", rarity: "C", colors: [], type: "Character",
        life: null, cost: null, power: null, counter: null, traits: [], attr: null,
        text: "", textEn: "", image: "", parallel: false, src: "custom", variant: "",
      };
    }

    let me = { isAdmin: false, canCards: false, canUsers: false, canRoles: false, role: "user" };

    async function boot() {
      let status;
      try {
        const r = await fetch("/api/admin/status", { credentials: "include" });
        status = await r.json();
      } catch {
        app.textContent = "Impossible de contacter le serveur.";
        return;
      }
      if (!status.signedIn) {
        app.innerHTML = '<div class="gate">Connecte-toi pour accéder à l\'administration.<br><br><a class="back" href="/login.html">Se connecter →</a></div>';
        return;
      }
      const staff = !!(status.canCards || status.canUsers || status.isAdmin);
      if (!staff) {
        app.innerHTML = '<div class="gate">Accès réservé à l\'équipe du jeu.</div>';
        return;
      }
      me = {
        isAdmin: !!status.isAdmin,
        canCards: status.canCards !== false && (status.canCards || status.role === "admin" || status.role === "owner" || (!status.role && status.isAdmin)),
        canUsers: status.canUsers !== false && (status.canUsers || status.isAdmin),
        canRoles: !!status.canRoles,
        role: status.role || "admin",
        id: status.id,
      };
      if (!me.canCards && me.canUsers) showTab("users");
      else showTab(location.hash === "#users" ? "users" : "cards");
    }

    function chrome(active) {
      const cardsTab = me.canCards
        ? `<button type="button" class="tab ${active === "cards" ? "on" : ""}" data-tab="cards">Cartes</button>`
        : "";
      const usersTab = me.canUsers
        ? `<button type="button" class="tab ${active === "users" ? "on" : ""}" data-tab="users">Utilisateurs</button>`
        : "";
      return `
        <div class="wrap admin-chrome" style="padding-bottom:0">
          <header>
            <div class="brand"><h1>Administrateur</h1></div>
            <a class="back" href="/">Retour</a>
          </header>
          <div class="tabs">${cardsTab}${usersTab}</div>
        </div>
        <div id="admin-body"></div>`;
    }

    function bindTabs(active) {
      app.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.onclick = () => showTab(btn.getAttribute("data-tab"));
      });
    }

    function showTab(which) {
      if (which === "users" && me.canUsers) {
        history.replaceState(null, "", "#users");
        app.className = "";
        app.innerHTML = chrome("users");
        bindTabs("users");
        if (window.GLAdminUsers) window.GLAdminUsers.render(document.getElementById("admin-body"));
        else {
          const s = document.createElement("script");
          s.src = "/admin-users.js?v=4";
          s.onload = () => window.GLAdminUsers.render(document.getElementById("admin-body"));
          document.body.appendChild(s);
        }
        return;
      }
      if (!me.canCards) {
        showTab("users");
        return;
      }
      history.replaceState(null, "", "#cards");
      renderEditor();
    }

    async function fetchCards() {
      const [baseRes, overridesRes] = await Promise.all([
        fetch("/data/catalog.json?admin=1", { cache: "no-store" }),
        fetch("/api/card-overrides", { credentials: "include", cache: "no-store" }),
      ]);
      const base = await baseRes.json();
      const overrides = overridesRes.ok ? await overridesRes.json() : [];
      const byId = new Map((base.cards || []).map((c) => [c.id, { ...c }]));
      for (const o of overrides) {
        if (!o || !o.id) continue;
        if (o.action === "delete") byId.delete(o.id);
        else if (o.card) byId.set(o.id, { ...(byId.get(o.id) || {}), ...o.card, id: o.id });
      }
      return {
        cards: Array.from(byId.values()),
        boosters: base.boosters || [],
        starters: base.starters || [],
      };
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function confirmBox(title, message, opts) {
      opts = opts || {};
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "overlay is-confirm";
        overlay.innerHTML =
          '<div class="confirm-card">' +
            "<h2>" + esc(title) + "</h2>" +
            "<p>" + esc(message) + "</p>" +
            '<div class="form-foot">' +
              '<button type="button" class="cancel" data-no>' + esc(opts.cancel || "Annuler") + "</button>" +
              '<button type="button" class="save' + (opts.danger ? " is-danger" : "") + '" data-yes>' +
                esc(opts.ok || "Confirmer") +
              "</button>" +
            "</div>" +
          "</div>";
        const done = (v) => { overlay.remove(); resolve(v); };
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay || e.target.closest("[data-no]")) done(false);
          if (e.target.closest("[data-yes]")) done(true);
        });
        document.body.appendChild(overlay);
      });
    }
    window.GLAdminConfirm = confirmBox;

    function renderEditor() {
      app.className = "";
      app.innerHTML = chrome("cards") + `
        <div class="wrap" style="padding-top:0">
          <header style="margin:0 0 .8rem;justify-content:flex-end">
            <button class="btn" id="new-card">+ Nouvelle carte</button>
          </header>
          <div class="toolbar">
            <div class="search"><span>🔍</span><input id="q" placeholder="Rechercher par nom, id ou set…" /></div>
            <select class="filter" id="f-type-filter"><option value="">Tous les types</option>${TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
            <select class="filter" id="f-color-filter"><option value="">Toutes les couleurs</option>${COLORS.map((c) => `<option value="${c}">${c}</option>`).join("")}</select>
          </div>
          <p class="status" id="status" hidden></p>
          <p class="count" id="count"></p>
          <div class="grid" id="list"></div>
        </div>
      `;
      bindTabs("cards");
      let cards = [];
      let packs = [];
      let q = "";
      let typeFilter = "";
      let colorFilter = "";

      const list = document.getElementById("list");
      const countEl = document.getElementById("count");
      const statusEl = document.getElementById("status");

      function showStatus(msg, isErr) {
        statusEl.hidden = false;
        statusEl.className = "status" + (isErr ? " err" : "");
        statusEl.textContent = msg;
      }

      function renderList() {
        const query = q.trim().toLowerCase();
        let filtered = cards;
        if (query) {
          filtered = filtered.filter(
            (c) => (c.id || "").toLowerCase().includes(query) || (c.name || "").toLowerCase().includes(query) || (c.set || "").toLowerCase().includes(query),
          );
        }
        if (typeFilter) filtered = filtered.filter((c) => c.type === typeFilter);
        if (colorFilter) filtered = filtered.filter((c) => c.colors?.includes(colorFilter));

        const shown = filtered.slice(0, 240);
        countEl.textContent =
          cards.length + " carte(s) au total" +
          (shown.length < filtered.length ? ` — ${shown.length} affichées, affine ta recherche` : "");
        list.innerHTML = "";
        for (const card of shown) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.innerHTML = `
            <div class="tile-img">
              <div class="ph">🂠</div>
              ${card.image ? `<img src="${esc(card.image)}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
              <div class="tile-actions">
                <button aria-label="Modifier" data-act="edit">✎</button>
                <button aria-label="Supprimer" class="danger" data-act="del">🗑</button>
              </div>
            </div>
            <div class="tile-body">
              <div class="tile-name">${esc(card.name)}</div>
              <div class="tile-meta">${esc(card.id)} · ${esc(card.set)} · ${esc(card.rarity)}</div>
            </div>
          `;
          tile.querySelector('[data-act="edit"]').onclick = () => openForm(card, false);
          tile.querySelector('[data-act="del"]').onclick = () => removeCard(card);
          list.appendChild(tile);
        }
      }

      async function refresh() {
        const data = await fetchCards();
        cards = data.cards || data;
        packs = [...(data.boosters || []), ...(data.starters || [])];
        renderList();
      }

      function purgeLiveCatalog() {
        try {
          navigator.serviceWorker?.controller?.postMessage({ type: "purge-catalog" });
        } catch {}
        try {
          const req = indexedDB.open("gl-tcg", 1);
          req.onsuccess = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains("kv")) return;
            const tx = db.transaction("kv", "readwrite");
            const store = tx.objectStore("kv");
            store.delete("catalog:fr-cards-opcollec-13");
            store.delete("catalog:fr-cards-opcollec-14");
          };
        } catch {}
      }

      async function removeCard(card) {
        const ok = await confirmBox(
          "Supprimer la carte",
          "Supprimer définitivement « " + card.name + " » (" + card.id + ") du jeu ?",
          { danger: true, ok: "Supprimer" },
        );
        if (!ok) return;
        try {
          const r = await fetch("/api/admin/cards?id=" + encodeURIComponent(card.id), {
            method: "DELETE",
            credentials: "include",
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Échec de la suppression.");
          purgeLiveCatalog();
          showStatus(`« ${card.name} » supprimée.`);
          await refresh();
        } catch (ex) {
          showStatus(ex.message, true);
        }
      }

      async function saveCard(input, saveBtn) {
        saveBtn.disabled = true;
        try {
          const r = await fetch("/api/admin/cards", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(input),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Échec de l'enregistrement.");
          purgeLiveCatalog();
          showStatus(`« ${input.name} » enregistrée.`);
          document.getElementById("overlay")?.remove();
          q = input.id;
          document.getElementById("q").value = q;
          await refresh();
        } catch (ex) {
          showStatus(ex.message, true);
        } finally {
          saveBtn.disabled = false;
        }
      }

      function openForm(card, isNew) {
        const form = isNew ? blankCard() : { ...card, textEn: card.textEn ?? "", traits: Array.isArray(card.traits) ? card.traits : [] };
        const overlay = document.createElement("div");
        overlay.className = "overlay";
        overlay.id = "overlay";
        const setOptions = packs
          .map((p) => `<option value="${esc(p.id)}">${esc(p.id)} — ${esc(p.name)}</option>`)
          .join("");
        overlay.innerHTML = `
          <div class="form-card">
            <div class="form-head">
              <h2>${isNew ? "Nouvelle carte" : "Modifier " + esc(card.id)}</h2>
              <button type="button" id="close-form" aria-label="Fermer">×</button>
            </div>
            <div class="form-body">
              <div class="preview">
                <div class="preview-img" id="preview-img"><div class="ph">Aucune image</div></div>
                <div class="field" style="width:100%;margin:0">
                  <span>Emplacement de l'image (chemin ou URL)</span>
                  <input id="f-image" placeholder="/cards-fr/OP01-001.webp ou https://…" />
                </div>
                <label class="check" style="width:100%"><input type="checkbox" id="f-parallel" /> Carte parallèle / alternative</label>
              </div>
              <div>
                <fieldset style="margin-bottom:.9rem">
                  <legend>Identité</legend>
                  <div class="field"><span>Identifiant</span><input id="f-id" placeholder="OP01-999" ${isNew ? "" : "disabled"} /></div>
                  <div class="field"><span>Nom</span><input id="f-name" /></div>
                  <div class="field-grid">
                    <div class="field"><span>Booster</span>
                      <input id="f-set" list="set-list" placeholder="OP-01" />
                      <datalist id="set-list">${setOptions}</datalist>
                    </div>
                    <div class="field"><span>Nom du booster</span><input id="f-setName" placeholder="Romance Dawn" /></div>
                  </div>
                  <div class="field"><span>Variante (optionnel)</span><input id="f-variant" placeholder="Classique, Manga, Full Art…" /></div>
                </fieldset>
                <fieldset style="margin-bottom:.9rem">
                  <legend>Statistiques</legend>
                  <div class="field-grid">
                    <div class="field"><span>Rareté</span><input id="f-rarity" /></div>
                    <div class="field"><span>Type</span>
                      <select id="f-type">${TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
                    </div>
                  </div>
                  <div class="field"><span>Couleurs</span><div class="chips" id="f-colors">
                    ${COLORS.map((c) => `<button type="button" class="chip" data-c="${c}">${c}</button>`).join("")}
                  </div></div>
                  <div class="field-grid g4">
                    <div class="field"><span>Vie</span><input id="f-life" inputmode="numeric" /></div>
                    <div class="field"><span>Coût</span><input id="f-cost" inputmode="numeric" /></div>
                    <div class="field"><span>Puissance</span><input id="f-power" inputmode="numeric" /></div>
                    <div class="field"><span>Contre</span><input id="f-counter" inputmode="numeric" /></div>
                  </div>
                  <div class="field-grid">
                    <div class="field"><span>Traits (virgules)</span><input id="f-traits" /></div>
                    <div class="field"><span>Attribut</span><input id="f-attr" /></div>
                  </div>
                </fieldset>
                <fieldset style="margin-bottom:.9rem">
                  <legend>Texte</legend>
                  <div class="field"><span>Texte (français)</span><textarea id="f-text" rows="3"></textarea></div>
                  <div class="field"><span>Texte (anglais, optionnel)</span><textarea id="f-textEn" rows="2"></textarea></div>
                </fieldset>
                <fieldset>
                  <legend>Origine</legend>
                  <div class="field" style="margin-bottom:0"><span>Source</span><input id="f-src" placeholder="custom" /></div>
                </fieldset>
              </div>
            </div>
            <div class="form-foot">
              <button type="button" class="cancel" id="cancel-form">Annuler</button>
              <button type="button" class="save" id="save-form">Enregistrer</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        const $ = (id) => overlay.querySelector(id);
        $("#f-id").value = form.id || "";
        $("#f-name").value = form.name || "";
        $("#f-set").value = form.set || "";
        $("#f-setName").value = form.setName || "";
        $("#f-variant").value = form.variant || "";
        $("#f-rarity").value = form.rarity || "";
        $("#f-type").value = TYPES.includes(form.type) ? form.type : (form.type || "Character");
        $("#f-life").value = form.life ?? "";
        $("#f-cost").value = form.cost ?? "";
        $("#f-power").value = form.power ?? "";
        $("#f-counter").value = form.counter ?? "";
        $("#f-traits").value = (form.traits || []).join(", ");
        $("#f-attr").value = form.attr ?? "";
        $("#f-text").value = form.text || "";
        $("#f-textEn").value = form.textEn || "";
        $("#f-image").value = form.image || "";
        $("#f-parallel").checked = !!form.parallel;
        $("#f-src").value = form.src || "custom";

        $("#f-set").addEventListener("input", () => {
          const id = $("#f-set").value.trim();
          const pack = packs.find((p) => p.id === id);
          if (pack && pack.name) $("#f-setName").value = pack.name;
        });

        const colors = new Set(Array.isArray(form.colors) ? form.colors : []);
        overlay.querySelectorAll(".chip").forEach((chip) => {
          if (colors.has(chip.dataset.c)) chip.classList.add("on");
          chip.onclick = () => {
            if (colors.has(chip.dataset.c)) colors.delete(chip.dataset.c);
            else colors.add(chip.dataset.c);
            chip.classList.toggle("on");
          };
        });

        const previewBox = $("#preview-img");
        function updatePreview() {
          const url = $("#f-image").value.trim();
          previewBox.innerHTML = "";
          if (!url) {
            previewBox.innerHTML = '<div class="ph">Aucune image</div>';
            return;
          }
          const img = document.createElement("img");
          img.src = url;
          img.alt = "";
          img.onerror = () => {
            previewBox.innerHTML = '<div class="ph">Image introuvable</div>';
          };
          previewBox.appendChild(img);
        }
        $("#f-image").addEventListener("input", updatePreview);
        updatePreview();

        const num = (v) => {
          const t = v.trim();
          if (!t) return null;
          const n = Number(t);
          return Number.isFinite(n) ? Math.trunc(n) : null;
        };

        overlay.querySelector("#close-form").onclick = () => overlay.remove();
        overlay.querySelector("#cancel-form").onclick = () => overlay.remove();
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
        const saveBtn = overlay.querySelector("#save-form");
        saveBtn.onclick = async () => {
          const payload = {
              id: $("#f-id").value.trim(),
              name: $("#f-name").value.trim(),
              set: $("#f-set").value.trim(),
              setName: $("#f-setName").value.trim() || $("#f-set").value.trim(),
              rarity: $("#f-rarity").value.trim() || "C",
              colors: Array.from(colors),
              type: $("#f-type").value,
              life: num($("#f-life").value),
              cost: num($("#f-cost").value),
              power: num($("#f-power").value),
              counter: num($("#f-counter").value),
              traits: $("#f-traits").value.split(",").map((s) => s.trim()).filter(Boolean),
              attr: $("#f-attr").value.trim() || null,
              text: $("#f-text").value,
              textEn: $("#f-textEn").value.trim() || undefined,
              image: $("#f-image").value.trim(),
              parallel: $("#f-parallel").checked,
              src: $("#f-src").value.trim() || "custom",
              variant: $("#f-variant").value.trim() || undefined,
          };
          if (!payload.id || !payload.name) {
            showStatus("Identifiant et nom obligatoires.", true);
            return;
          }
          if (!payload.set) {
            showStatus("Le booster est obligatoire.", true);
            return;
          }
          if (!payload.image) {
            showStatus("L'emplacement de l'image est obligatoire.", true);
            return;
          }
          const ok = await confirmBox(
            isNew ? "Créer la carte" : "Enregistrer la carte",
            isNew
              ? "Créer « " + payload.name + " » (" + payload.id + ") ?"
              : "Enregistrer les modifications de « " + payload.name + " » ?",
            { ok: isNew ? "Créer" : "Enregistrer" },
          );
          if (!ok) return;
          saveCard(payload, saveBtn);
        };
      }

      document.getElementById("new-card").onclick = () => openForm(blankCard(), true);
      document.getElementById("q").addEventListener("input", (e) => {
        q = e.target.value;
        renderList();
      });
      document.getElementById("f-type-filter").addEventListener("change", (e) => {
        typeFilter = e.target.value;
        renderList();
      });
      document.getElementById("f-color-filter").addEventListener("change", (e) => {
        colorFilter = e.target.value;
        renderList();
      });

      refresh();
    }

    boot();
  </script>
</body>
</html>
